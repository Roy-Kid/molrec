# Mirrors every check in .github/workflows/ci.yml. Any divergence is a bug —
# when you add/modify a CI step, update this file in the same commit.
#
# CI (.github/workflows/ci.yml) runs:
#   - lint: `uvx ruff check .` then `uvx ruff format --check .`
#   - test: `uv sync --frozen` then `uv run --with pytest pytest -q` (Python 3.12)
# The local hooks below invoke the IDENTICAL `uvx` / `uv run` commands so the
# tool versions match CI exactly.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-toml
      - id: check-json

  - repo: local
    hooks:
      # CI: lint job -> `uvx ruff check .`
      - id: ruff-check
        name: ruff check (uvx, mirrors CI lint job)
        entry: uvx ruff check .
        language: system
        types: [python]
        pass_filenames: false

      # CI: lint job -> `uvx ruff format --check .`
      - id: ruff-format
        name: ruff format --check (uvx, mirrors CI lint job)
        entry: uvx ruff format --check .
        language: system
        types: [python]
        pass_filenames: false

      # CI: test job -> `uv run --with pytest pytest -q` (run at pre-push, like CI on push/PR)
      - id: pytest
        name: pytest (uv run, mirrors CI test job)
        entry: uv run --with pytest pytest -q
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
